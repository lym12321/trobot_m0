# daplink.cfg

source [find interface/cmsis-dap.cfg]

# MSPM0G3507 SRAM starts at 0x20200000. The generic target script defaults to
# 0x20000000, which makes OpenOCD's flash verification CRC helper time out.
set WORKAREABASE 0x20200000
set WORKAREASIZE 0x400
source [find target/ti_mspm0.cfg]

adapter speed 24000
